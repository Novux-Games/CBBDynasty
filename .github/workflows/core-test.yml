name: Core tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: core-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run :core:test
        run: |
          for attempt in 1 2 3; do
            ./gradlew :core:test --no-daemon && exit 0
            echo "Gradle attempt $attempt failed; retrying..."
            sleep 15
          done
          exit 1
