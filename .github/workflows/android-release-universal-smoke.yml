name: Android release universal APK smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-universal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-universal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        working-directory: ${{ github.workspace }}
        run: bash scripts/install_android_sdk.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release universal APK (sideload smoke)
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_SIDELOAD_OUT: ${{ github.workspace }}/android/app/build/outputs/sideload/release
        run: bash scripts/build_release_universal_apk.sh

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal-apk
          path: android/app/build/outputs/sideload/release/universal.apk
          if-no-files-found: error
